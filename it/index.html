<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.xlink{display:inline-block;margin:0 0 10px;font-size:13px;color:var(--accent);text-decoration:none}.xlink:hover{text-decoration:underline}</style></head><body>
<title>표지 지도 2026 (IT 출판사)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치 개념: 표지가 유일한 색이 되도록 화면은 차가운 무채색으로 물러나고, 왼쪽 필터 칸과 오른쪽 서가로 나눈다 */
:root{
  --bg:#eceef0; --surface:#f8f9fa; --line:#d5d9dd; --ink:#15191e; --ink2:#4d555e; --ink3:#69727c;
  --accent:#0b5c6b; --accent-soft:#d6e7ea; --on-accent:#ffffff; --new:#8a4b00; --new-soft:#f6e6cd;
  --heat0:#edf3f4; --heat1:#c2dbdf; --heat2:#8abcc4; --heat3:#4e98a5; --heat4:#1f7384; --heat5:#0b5163;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8f97a0;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a; --new:#f0bd72; --new-soft:#3a2c14;
  --heat0:#1c2529; --heat1:#1d3a42; --heat2:#1f5664; --heat3:#2c7b8c; --heat4:#52a5b5; --heat5:#90d0db; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8f97a0;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a; --new:#f0bd72; --new-soft:#3a2c14;
  --heat0:#1c2529; --heat1:#1d3a42; --heat2:#1f5664; --heat3:#2c7b8c; --heat4:#52a5b5; --heat5:#90d0db; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;gap:12px 28px;align-items:flex-end;flex-wrap:wrap;padding-block:20px 0;padding-left:var(--gl);padding-right:var(--gr);border-bottom:1px solid var(--line)}
.brand{min-width:0}
.brand h1{font:700 26px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.brand h1 small{font:500 15px/1 var(--sans);color:var(--ink2);margin-left:6px;letter-spacing:0}
.brand p{margin:3px 0 10px;color:var(--ink2);font-size:13px}
.dl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.dl button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:12.5px}
.dl button:hover{border-color:var(--accent);color:var(--accent)}
.dl button[disabled]{opacity:.5;cursor:default}
.dlmsg{font-size:12px;color:var(--ink2)}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{border:0;background:none;padding:9px 16px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{display:block}

/* 탐색 */
.browse{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 92px)}
aside.filters{border-right:1px solid var(--line);padding:16px 14px 40px var(--gl);overflow:auto;position:sticky;top:0;max-height:100vh}
aside.filters summary{display:none}
.fgroup{margin-bottom:18px}
.fgroup h3{font-size:12px;letter-spacing:.04em;color:var(--ink3);margin:0 0 6px;font-weight:700}
.opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 7px;border-radius:5px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--line)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt .c{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;opacity:.7}
.opt[disabled]{opacity:.35;cursor:default}
.opt .nw{font-size:10.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px;line-height:1.5;opacity:.8;flex:none}
.colorrow{display:flex;flex-wrap:wrap;gap:6px}
.colorbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);padding:0}
.colorbtn[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.shelf{padding:16px var(--gr) 60px 20px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=search]{flex:1 1 260px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.hint{margin:-4px 0 10px;color:var(--ink3);font-size:12px}
.card small.why{color:var(--accent);font-size:11.5px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:0}
.chip{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:2px 10px;font-size:12.5px}
.chip.clear{border-color:var(--line);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px 16px}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .ph{aspect-ratio:2/3;display:flex;align-items:flex-end;justify-content:center;max-width:100%}
.card img{max-width:100%;max-height:100%;display:block;box-shadow:0 1px 2px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.14);transition:transform .15s}
.card:hover img{transform:translateY(-3px)}
.card b{font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--ink3);font-size:11.5px}
.empty{padding:60px 0;color:var(--ink2);text-align:center}

/* 상세 */
dialog{border:0;padding:0;width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);border-radius:10px}
dialog::backdrop{background:rgba(10,14,18,.6)}
.det{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:26px;padding:24px;position:relative}
.det>div{min-width:0}
.det img.big{width:100%;display:block;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.det h2{font:700 23px/1.3 var(--serif);margin:0 22px 4px 0;text-wrap:balance}
.det .sub{color:var(--ink2);margin:0 0 12px}
.det .note{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0 16px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--ink3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pal{display:flex;height:26px;border-radius:4px;overflow:hidden;margin:12px 0 4px}
.pal i{display:block;height:100%}
.xbtn{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);padding:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:7px;padding:7px 13px;text-decoration:none;font-size:13px}
.btn.ghost{background:none;color:var(--accent)}
.sim{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.sim button{border:0;background:none;padding:0}.sim img{width:100%;display:block}
h4.sh{font-size:12px;color:var(--ink3);margin:16px 0 4px}

/* 스타일 사전 */
.wrap{padding-block:20px 60px;padding-left:var(--gl);padding-right:var(--gr);max-width:1280px}
.intro{max-width:66ch;color:var(--ink2);margin:0 0 20px}
.style{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.style>div{min-width:0}
.style h2{font:700 21px/1.3 var(--serif);margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tagnew{font:700 11px/1.6 var(--sans);background:var(--new-soft);color:var(--new);border-radius:4px;padding:0 7px}
.style .n{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.style p{margin:6px 0 10px;max-width:60ch}
.style p.why{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--new);padding-left:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tags span{background:var(--accent-soft);border-radius:4px;padding:1px 7px;font-size:12px}
.mini{display:grid;grid-template-columns:96px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.mini .tr{height:7px;background:var(--heat0);border-radius:0 4px 4px 0}
.mini .tr i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.mini .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.samples{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.samples button{border:0;background:none;padding:0}
.samples img{width:100%;display:block;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* 출판사 비교 */
h2.sec{font:700 19px/1.3 var(--serif);margin:34px 0 4px}
h2.sec:first-of-type{margin-top:0}
.tblwrap{overflow-x:auto;margin-bottom:8px}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px}
table.heat th{font-weight:500;color:var(--ink2);padding:4px 6px;text-align:left}
table.heat thead th{vertical-align:bottom;min-width:62px;width:62px;padding:4px 3px;font-size:11.5px;line-height:1.25;word-break:keep-all;text-align:center}
table.heat thead th.nw span{color:var(--new);font-weight:700}
table.heat tbody th{white-space:nowrap;color:var(--ink);font-weight:600;padding-right:12px}
table.heat td{height:38px;text-align:center;font-variant-numeric:tabular-nums;border-radius:3px;padding:0}
table.heat td button{width:100%;height:100%;border:0;background:none;color:inherit;border-radius:3px}
.legend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-bottom:26px;flex-wrap:wrap}
.legend i{width:26px;height:12px;display:block}
.pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:26px 30px}
.pub{min-width:0}
.pub h3{font:700 18px/1.3 var(--serif);margin:0 0 2px}
.pub .meta{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;margin-bottom:8px}
.pub p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.strip{display:flex;height:44px;border-radius:3px;overflow:hidden}
.strip i{flex:1 1 0;display:block;min-width:0}
.serrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;text-align:left}
.serrow:hover b{color:var(--accent)}
.serrow b{font-weight:600;font-size:13.5px}
.serrow span{display:block;color:var(--ink3);font-size:12px}
.serrow .th{display:flex;gap:4px}
.serrow .th img{height:54px;width:auto;display:block;box-shadow:0 1px 4px rgba(0,0,0,.2)}
table.crit{border-collapse:collapse;font-size:13px;min-width:560px}
table.crit th,table.crit td{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;text-align:left;vertical-align:top}
table.crit td.num,table.crit th.num{text-align:right;font-variant-numeric:tabular-nums}
table.crit th{color:var(--ink3);font-weight:600;font-size:12px}
ul.rules{margin:8px 0 16px;padding-left:18px;max-width:72ch;color:var(--ink2)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:5px;font-size:12px;max-width:240px}
footer.src{padding-block:12px 30px;padding-left:var(--gl);padding-right:var(--gr);color:var(--ink3);font-size:12px;border-top:1px solid var(--line)}

@media (max-width:820px){
  :root{--gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px))}
  .browse{grid-template-columns:minmax(0,1fr)}
  aside.filters{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px var(--gr) 12px var(--gl)}
  aside.filters summary{display:block;font-weight:700;padding:4px 0;cursor:pointer}
  .det{grid-template-columns:minmax(0,1fr)}.style{grid-template-columns:minmax(0,1fr)}
  .samples{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  nav.tabs{margin-left:0;max-width:100%;overflow-x:auto}
  nav.tabs button{padding:9px 12px}
  .shelf{padding-left:var(--gl)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top">
  <div class="brand">
    <h1>표지 지도 2026 <small>IT 출판사</small></h1>
    <p id="sum"></p><a class="xlink" href="../">전체 출판사 지도 →</a>
    <div class="dl" id="dl" hidden>
      <button id="dlZip">전체 파일 내려받기 (ZIP)</button>
      <button id="dlCsv">도서 목록 내려받기 (CSV)</button>
      <span class="dlmsg" id="dlMsg" role="status"></span>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-v="browse" aria-selected="true">표지 찾기</button>
    <button role="tab" data-v="dict" aria-selected="false">스타일 사전</button>
    <button role="tab" data-v="comp" aria-selected="false">출판사 비교</button>
  </nav>
</header>
<main>
  <section class="view" id="browse">
    <div class="browse">
      <aside class="filters"><details id="fd" open><summary>필터 열기</summary><div class="fbody" id="filters"></div></details></aside>
      <div class="shelf">
        <div class="bar">
          <input type="search" id="q" placeholder="제목, 저자, 시리즈, 소재, 특징으로 찾기 (예: 클로드, 로봇, Do it!)" aria-label="검색">
          <select id="sort" aria-label="정렬">
            <option value="date">최신 출간순</option>
            <option value="bright">밝은 표지순</option>
            <option value="dark">어두운 표지순</option>
            <option value="sat">색이 강한 순</option>
            <option value="pub">출판사순</option>
          </select>
          <span class="count" id="count"></span>
        </div>
        <p class="hint">글자로 찾습니다. 제목, 부제, 시리즈, 저자, 분야와 표지 분석 메모(소재·기법·색·분위기)가 대상입니다. 표지 이미지 속 글자를 직접 읽지는 않습니다.</p>
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>조건에 맞는 표지가 없습니다. 위의 필터를 하나씩 풀어 보세요.</div>
      </div>
    </div>
  </section>
  <section class="view wrap" id="dict" hidden></section>
  <section class="view wrap" id="comp" hidden></section>
</main>
<footer class="src" id="src"></footer>
<dialog id="dlg"></dialog>
<div class="tip" id="tip" hidden></div>

<script>
const {books:B,styles:S,labels:L,pubs:P,pubNotes:PN,meta:META,series:SER,criteria:CR}=window.DATA;
const byId=Object.fromEntries(S.map(s=>[s.id,s]));
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS={'흰색':'#f7f7f5','베이지':'#e8dcc0','노랑':'#f2cf3a','주황':'#f08a2c','분홍':'#f09cb5','빨강':'#d3302c','보라':'#7e57c2','파랑':'#2f6fd6','청록':'#23a6a6','초록':'#3f9a57','갈색':'#7b4f2e','회색':'#9aa0a6','검정':'#1c1c1c'};
const FACETS=[
 {k:'style',t:'대표 스타일',f:b=>[b.style],n:v=>byId[v].ko},
 {k:'pub',t:'출판사',f:b=>[b.pub],n:v=>v},
 {k:'series',t:'시리즈',f:b=>b.series?[b.series]:[],n:v=>v,limit:16},
 {k:'catTop',t:'분야',f:b=>[b.catTop],n:v=>v,limit:8},
 {k:'topic',t:'IT 주제',f:b=>b.topic?[b.topic]:[],n:v=>v,limit:10},
 {k:'promo',t:'판촉 요소(뱃지·칩)',f:b=>[b.promo],n:v=>L.promo[v]||v},
 {k:'mood',t:'분위기',f:b=>b.mood,n:v=>L.mood[v]||v},
 {k:'medium',t:'표현 기법',f:b=>[b.medium],n:v=>L.medium[v]||v},
 {k:'layout',t:'구도',f:b=>[b.layout],n:v=>L.layout[v]||v},
 {k:'typeface',t:'제목 글꼴',f:b=>[b.typeface],n:v=>L.typeface[v]||v},
];
const state={q:'',qt:[],sort:'date',sel:{},color:new Set()};
FACETS.forEach(f=>state.sel[f.k]=new Set());
function match(b,skip){
  for(const f of FACETS){ if(f.k===skip)continue; const s=state.sel[f.k]; if(s.size&&!f.f(b).some(v=>s.has(v)))return false }
  if(skip!=='color'&&state.color.size&&!b.colorFam.some(c=>state.color.has(c)))return false;
  if(state.qt.length&&!state.qt.every(t=>b._f.some(f=>t(f[2]))))return false;
  return true;
}
B.forEach(b=>{b._f=[['제목',b.title],['부제',b.subtitle],['시리즈',b.series],['저자',b.author],['출판사',b.pub],['분야',b.cat.replace(/>/g,' › ')],['표지 메모',b.note],['스타일',byId[b.style].ko],['소재',(b.motif||[]).join(', ')],['기법',L.medium[b.medium]],['구도',L.layout[b.layout]],['글꼴',L.typeface[b.typeface]],['제목 위치',L.title_pos[b.title_pos]],['분위기',(b.mood||[]).map(m=>L.mood[m]).join(', ')],['판촉 요소',L.promo[b.promo]],['색',b.colorFam.join(', ')]].filter(f=>f[1]).map(f=>[f[0],f[1],f[1].toLowerCase()])});
// 영문·숫자 검색어는 낱말 단위로 맞춘다. 그래야 AI가 Again이나 KAIST 안의 글자에 걸리지 않는다.
function compileQ(q){return q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>{if(!/^[a-z0-9]+$/.test(w))return t=>t.includes(w);const re=new RegExp('(^|[^a-z0-9])'+w+(w.length<=3?'(?![a-z0-9])':''));return t=>re.test(t)})}
function why(b){if(!state.qt.length)return '';const seen=new Set();state.qt.forEach(t=>{const f=b._f.find(x=>t(x[2]));if(f)seen.add(f)});const list=[...seen].filter(f=>f[0]!=='제목');return list.length?'<small class="why">'+list.map(f=>esc(f[0])+': '+esc(f[1].length>34?f[1].slice(0,34)+'…':f[1])).join(' / ')+'</small>':''}
function renderFilters(){
  const root=$('#filters'); root.innerHTML='';
  FACETS.forEach(f=>{
    const cnt={}; B.forEach(b=>{if(match(b,f.k))f.f(b).forEach(v=>cnt[v]=(cnt[v]||0)+1)});
    const all={}; B.forEach(b=>f.f(b).forEach(v=>all[v]=(all[v]||0)+1));
    let keys=Object.keys(all).sort((a,c)=>all[c]-all[a]);
    if(f.k==='pub')keys=P;
    if(f.k==='promo')keys=['heavy','light','none'].filter(k=>all[k]);
    if(f.limit){const on=[...state.sel[f.k]];keys=keys.slice(0,f.limit);on.forEach(v=>{if(!keys.includes(v))keys.push(v)})}
    const g=el('div','fgroup','<h3>'+f.t+'</h3>');
    keys.forEach(v=>{const o=el('button','opt','<span>'+esc(f.n(v))+'</span>'+(f.k==='style'&&byId[v].isNew?'<span class="nw">IT</span>':'')+'<span class="c">'+(cnt[v]||0)+'</span>');
      const on=state.sel[f.k].has(v); o.setAttribute('aria-pressed',on); if(!cnt[v]&&!on)o.disabled=true;
      o.onclick=()=>{on?state.sel[f.k].delete(v):state.sel[f.k].add(v);render()}; g.append(o)});
    root.append(g);
    if(f.k==='pub'){const c=el('div','fgroup','<h3>주요 색</h3>'),r=el('div','colorrow');
